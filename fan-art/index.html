<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fan Art Gallery</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f8fb;color:#292c38;font-family:system-ui,-apple-system,sans-serif}header{text-align:center;padding:60px 20px 36px}h1{font-size:clamp(27px,5vw,42px);margin:0 0 10px}header p{color:#777b8a;margin:0}.fa-guide{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:9px 15px;border:1px solid rgba(117,122,155,.2);border-radius:999px;background:rgba(230,233,244,.58);color:#535c81;font-size:13px;text-decoration:none;transition:background .2s}.fa-guide:hover,.fa-guide:focus-visible{background:rgba(217,223,241,.9);text-decoration:underline}.grid{max-width:1150px;margin:0 auto;padding:0 20px 65px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:22px}.item{background:rgba(235,238,247,.48);border:1px solid rgba(218,221,234,.62);border-radius:15px;overflow:hidden;box-shadow:0 5px 22px #10102008}.item .thumb{aspect-ratio:4/3;overflow:hidden;background:#f0f0f4}.item img{display:block;width:100%;height:100%;object-fit:cover;background:#f0f0f4;cursor:zoom-in}.item .credits{background:rgba(226,231,243,.52);padding:12px 15px;min-height:20px;font-size:13px;line-height:1.65;overflow-wrap:anywhere;color:#505468}.credits{font-size:13px;line-height:1.65;overflow-wrap:anywhere}.modal{position:fixed;inset:0;background:#0c0e17ed;display:none;align-items:center;justify-content:center;flex-direction:column;padding:30px;z-index:10;gap:12px}.modal.open{display:flex}.modal img{max-width:95vw;max-height:78vh;object-fit:contain}.modal .credits{color:white;text-align:center;background:transparent;padding:8px 12px}.close{position:absolute;right:20px;top:15px;border:0;background:#ffffff26;color:white;border-radius:8px;padding:10px 14px;cursor:pointer}@media(max-width:560px){header{padding:38px 15px 28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 12px 40px}.item .credits{font-size:11px;padding:9px}}</style></head><body><header><h1>Fan Art Gallery</h1><p>いただいたファンアート一覧</p><a class="fa-guide" href="https://koyuki-detective.studio.site/fa" target="_blank" rel="noopener noreferrer">ⓘ ファンアートについて・ガイドライン</a></header><main id="grid" class="grid"></main><div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="作品の拡大表示"><button id="close" class="close">閉じる ✕</button><img id="big" alt="ファンアート"><div id="detail" class="credits"></div></div><script>const items=[{"image":"images/fa_0001.png","credits":["Illustration by hanabi様","Gift from ジ・鬼人様"],"cropX":82,"cropY":13,"cropZoom":195},{"image":"images/fa_0002.png","credits":["Illustration by 27/ﾂﾅ🐟様","Gift from ジ・鬼人様"],"cropX":50,"cropY":50,"cropZoom":100},{"image":"images/fa_0003.png","credits":["Illustration by 四季シキ様","Gift from ジ・鬼人様"],"cropX":50,"cropY":28,"cropZoom":100},{"image":"images/fa_0004.png","credits":["Illustration by 星苗/Hoshinae様","Gift from ジ・鬼人様"],"cropX":50,"cropY":6,"cropZoom":135}];const grid=document.getElementById('grid'),modal=document.getElementById('modal'),big=document.getElementById('big'),detail=document.getElementById('detail');function addCredits(node,lines){lines.forEach(t=>{const div=document.createElement('div');div.textContent=t;node.append(div)})}items.forEach(item=>{const box=document.createElement('article');box.className='item';const img=document.createElement('img');img.src=item.image;img.alt='ファンアート';img.loading='lazy';img.style.objectPosition=`${item.cropX??50}% ${item.cropY??50}%`;img.style.transformOrigin=`${item.cropX??50}% ${item.cropY??50}%`;img.style.transform=`scale(${(item.cropZoom??100)/100})`;img.onclick=()=>{big.src=item.image;detail.replaceChildren();addCredits(detail,item.credits);modal.classList.add('open')};const thumb=document.createElement('div');thumb.className='thumb';thumb.append(img);box.append(thumb);const credit=document.createElement('div');credit.className='credits';addCredits(credit,item.credits);box.append(credit);grid.append(box)});function close(){modal.classList.remove('open');big.removeAttribute('src')}document.getElementById('close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.onkeydown=e=>{if(e.key==='Escape')close()};</script><script src="https://koyukitai.github.io/creator-hub/menu.js"></script></body></html>
