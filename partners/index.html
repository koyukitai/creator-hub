<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#f8f6f2" name="theme-color"/><title>Partner Illustrators | 小幸たい</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:#49362f;font-family:system-ui,'Noto Sans JP',sans-serif;line-height:1.7}header{border-bottom:1px solid #ded7cf;padding:23px max(22px,calc((100vw - 1050px)/2))}header a{color:inherit;text-decoration:none}main{max-width:1050px;margin:auto;padding:65px 22px 100px}.kicker{color:#a62929;letter-spacing:.18em;font-size:12px;font-weight:700}h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(38px,6vw,65px);margin:7px 0}h2{font-size:21px}p{color:#6b5d56}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.card,.panel{background:white;border:1px solid #e0d9d2;padding:23px}.card img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#f5f1ed}.card h2{margin:14px 0 5px}.muted{font-size:13px;color:#806f66}.btn,button{display:inline-block;background:#a62929;color:white;border:0;padding:10px 16px;text-decoration:none;font:inherit;cursor:pointer}button.secondary,.btn.secondary{background:white;color:#a62929;border:1px solid #a62929}button.danger{background:#66534b}input,textarea,select{font:inherit;padding:10px;width:100%;border:1px solid #cfc4bc;background:#fff}label{display:block;font-size:13px;margin:14px 0 5px;font-weight:700}textarea{min-height:85px}button{margin:7px 7px 7px 0}.note{background:#f1eae4;padding:16px;font-size:13px}.preview{max-width:220px;max-height:170px;object-fit:contain}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:15px 0}.toolbar button{margin:0}.split{display:grid;grid-template-columns:300px 1fr;gap:18px}.listitem{padding:13px;border-bottom:1px solid #e5ddd6;cursor:pointer}.listitem.active{background:#f6eae6;border-left:3px solid #a62929}.work-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px}.work-grid img{width:100%;height:150px;object-fit:contain;background:#f5f1ed}.work-grid figure{margin:0}.work-grid figcaption{font-size:11px}.error{color:#a62929}@media(max-width:720px){.split{grid-template-columns:1fr}main{padding-top:40px}}
.hero{padding:30px 0 18px}.avatar{width:84px;height:84px;object-fit:cover;border-radius:50%;border:2px solid #e8ded7;background:#f4eee8}.profile{display:flex;align-items:center;gap:16px}.profile h2{margin:0}.benefits{background:#f8f0ec;border-left:3px solid #a62929;padding:14px 18px;margin:18px 0}.benefits h3{margin:0 0 5px;font-size:14px;color:#a62929}.benefits p{margin:0;white-space:pre-wrap}.samples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.samples figure{margin:0}.samples img{width:100%;height:190px;object-fit:contain;background:#f7f3ef}.samples figcaption{font-size:12px;color:#76665e}.card .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.card .actions a{font-size:13px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.image-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.image-entry{background:#f8f6f2;padding:8px}.image-entry img{width:100%;height:130px;object-fit:contain}.image-entry input{font-size:12px}.help{font-size:12px;color:#75665f}.status{font-size:12px;color:#a62929}@media(max-width:650px){.field-row{grid-template-columns:1fr}.samples img{height:145px}}
.container{max-width:1000px;margin:0 auto;padding:0 44px}
.topbar{border-bottom:1px solid var(--line)}
.topbar-inner{min-height:80px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-size:14px;font-weight:750;letter-spacing:.18em;text-decoration:none}
.toplink{font-size:12px;text-decoration:none;color:var(--muted)}
.toplink:hover{color:var(--red)}
.footer{background:#eee9e3;border-top:1px solid #ded5cc}
.footer-inner{padding:25px 0;display:flex;justify-content:space-between;gap:12px;color:#796a61;font-size:11px;letter-spacing:.08em}
header.topbar{padding:0} .topbar .container,.footer .container{max-width:1000px;margin:auto;padding-left:44px;padding-right:44px} .footer{margin-top:30px} @media(max-width:760px){.topbar .container,.footer .container{padding-left:22px;padding-right:22px}}</style></head><body><header class="topbar"><div class="container topbar-inner"><a class="brand" href="../">KOYUKI TAI.</a><a class="toplink" href="../">← HOME</a></div></header><main><div class="kicker">CREATIVE PARTNERS</div><h1>Partner Illustrators.</h1><p>提携イラストレーター様をご紹介します。作品サンプルや提携特典をご覧いただき、各イラストレーター様の依頼ページ・SNSから詳細をご確認いただけます。</p><div class="grid" id="cards"></div><p class="muted" id="message"></p></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=s=>{try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const imageSrc=s=>typeof s==='string'&&(s.startsWith('data:image/png;base64,')||s.startsWith('data:image/jpeg;base64,')||s.startsWith('data:image/webp;base64,')||safeUrl(s))?s:'';
const link=(url,label)=>safeUrl(url)?`<a class="btn secondary" href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${label}</a>`:'';
fetch('./partners.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{
if(!Array.isArray(data))throw Error();let items=data.filter(x=>x.published);document.getElementById('message').textContent=items.length?'':'現在、掲載準備中です。';
document.getElementById('cards').innerHTML=items.map(x=>`<article class="card"><div class="profile">${imageSrc(x.icon)?`<img class="avatar" src="${esc(imageSrc(x.icon))}" alt="${esc(x.name)}様のアイコン">`:'<div class="avatar" aria-hidden="true"></div>'}<div><h2>${esc(x.name)}</h2><div class="status">${esc(x.status||'受付状況は依頼先でご確認ください')}</div></div></div><p>${esc(x.description||'')}</p>${x.benefits?`<div class="benefits"><h3>提携特典</h3><p>${esc(x.benefits)}</p></div>`:''}<div class="actions">${link(x.orderUrl,'ご依頼ページ')}${link(x.x,'X（旧Twitter）')}${link(x.website,'Webサイト')}</div>${(x.images||[]).length?`<div class="samples">${x.images.filter(im=>imageSrc(im.src)).map(im=>`<figure><img loading="lazy" src="${esc(imageSrc(im.src))}" alt="${esc(im.alt||'イラストサンプル')}"><figcaption>${esc(im.caption||'')}</figcaption></figure>`).join('')}</div>`:''}</article>`).join('');
}).catch(()=>document.getElementById('message').textContent='データを読み込めませんでした。GitHub PagesなどのWebサーバーでご確認ください。');
</script><footer class="footer"><div class="container footer-inner"><span>KOYUKI TAI — CREATOR OFFICIAL WEBSITE</span><span>© KOYUKI TAI</span></div></footer><script src="https://koyukitai.github.io/creator-hub/menu.js"></script></body></html>
